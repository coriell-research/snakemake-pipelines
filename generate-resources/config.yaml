# Root directory that all generated resources are written under, following the
# existing "<resources_dir>/<assembly>/GENCODE/<release>/<resource>" layout that
# atacseq-pe/rnaseq-pe/rrbs-pe already point their own configs at.
resources_dir: "/home/gennaro/data/references"

human:
  assembly: "GRCh38"
  release: "v48"
  urls:
    annotation_gtf: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_48/gencode.v48.basic.annotation.gtf.gz"
    promoter_windows: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_48/gencode.v48.promoter_windows.gff3.gz"
    transcripts_fa: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_48/gencode.v48.transcripts.fa.gz"
    genome_fa: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_48/GRCh38.primary_assembly.genome.fa.gz"
  star:
    # optimized for 150bp reads, per instructions.md
    sjdb_overhang: 149
  excluderanges:
    # AnnotationHub record ID for the excluderanges set used in instructions.md
    annotationhub_id: "AH107305"

# NOTE: instructions.md only documents downloads for mouse (no index-build
# commands), so this workflow only downloads the mouse annotation/transcript/
# genome files and the M25 rseqc BED files. Mouse STAR/bowtie2/etc. indices can
# be added the same way as the human rules once a build recipe is specified.
mouse:
  m38:
    assembly: "GRCm39"
    release: "M38"
    urls:
      annotation_gtf: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M38/gencode.vM38.basic.annotation.gtf.gz"
      transcripts_fa: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M38/gencode.vM38.transcripts.fa.gz"
      genome_fa: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M38/GRCm39.primary_assembly.genome.fa.gz"
  m25:
    assembly: "GRCm38"
    release: "M25"
    urls:
      annotation_gtf: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M25/gencode.vM25.annotation.gtf.gz"
      transcripts_fa: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M25/gencode.vM25.transcripts.fa.gz"
      genome_fa: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M25/GRCm38.primary_assembly.genome.fa.gz"
      rseqc_basic_bed: "https://sourceforge.net/projects/rseqc/files/BED/Mouse_Mus_musculus/mm10_GENCODE_VM25_basic.bed.gz"
      rseqc_comprehensive_bed: "https://sourceforge.net/projects/rseqc/files/BED/Mouse_Mus_musculus/mm10_GENCODE_VM25_comprehensive.bed.gz"
      rseqc_ucsc_knowngene_bed: "https://sourceforge.net/projects/rseqc/files/BED/Mouse_Mus_musculus/mm10_UCSC_knownGene.bed.gz"
      rseqc_housekeeping_bed: "https://sourceforge.net/projects/rseqc/files/BED/Mouse_Mus_musculus/mm10.HouseKeepingGenes.bed.gz"

# Spike-in / decoy sequences used by several of the human indices (STAR,
# bowtie2, bwa-mem2, salmon, minimap2, minibwa include ERCC+GFP; Bismark and
# bwa-meth include the lambda phage genome instead - see instructions.md).
# These are treated as existing, stable local reference files rather than
# something this workflow downloads, matching how this server's already-built
# GRCh38/GENCODE/v48 resources reference them.
spike_ins:
  ercc_fasta: "/home/gennaro/data/references/ERCC/ERCC92.fa"
  gfp_fasta: "/home/gennaro/data/references/pEGFP/pEGFP-N1.fa"
  lambda_fasta_gz: "/home/gennaro/data/references/lambdaphage/J02459.1_lambda.fa.gz"

threads:
  star: 32
  bowtie2: 32
  salmon: 32
  bismark_genome_preparation: 24
  minibwa: 8
