# Root directory that all generated resources are written under, following the
# existing "<resources_dir>/<assembly>/GENCODE/<release>/<resource>" layout 
resources_dir: "references"

human:
  assembly: "GRCh38"
  release: "v48"
  urls:
    annotation_gtf: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_48/gencode.v48.basic.annotation.gtf.gz"
    promoter_windows: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_48/gencode.v48.promoter_windows.gff3.gz"
    transcripts_fa: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_48/gencode.v48.transcripts.fa.gz"
    genome_fa: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_48/GRCh38.primary_assembly.genome.fa.gz"
  star:
    sjdb_overhang: 149
  excluderanges:
    bed_url: "https://api.bedbase.org/v1/files/files/c/0/c0196a8252435085ceb64dc3b3ddf518.bed.gz"

mouse:
  m38:
    assembly: "GRCm39"
    release: "M38"
    urls:
      annotation_gtf: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M38/gencode.vM38.basic.annotation.gtf.gz"
      transcripts_fa: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M38/gencode.vM38.transcripts.fa.gz"
      genome_fa: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M38/GRCm39.primary_assembly.genome.fa.gz"
    star:
      sjdb_overhang: 149
    excluderanges:
      bed_url: "https://api.bedbase.org/v1/files/files/6/7/67c08efd44d558f0aafbb1240e93a97a.bed.gz"
  m25:
    assembly: "GRCm38"
    release: "M25"
    urls:
      annotation_gtf: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M25/gencode.vM25.annotation.gtf.gz"
      transcripts_fa: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M25/gencode.vM25.transcripts.fa.gz"
      genome_fa: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M25/GRCm38.primary_assembly.genome.fa.gz"
    star:
      sjdb_overhang: 149
    excluderanges:
      bed_url: "https://api.bedbase.org/v1/files/files/9/9/9975fc0dabb9342939f4da104f5e5724.bed.gz"

# Drosophila melanogaster spike-in genome (Ensembl BDGP6.54 = dm6 sequence; release 114 matches
# GENCODE v48 / Ensembl 114). Fly contigs, gene_ids and transcript_ids are prefixed "dm6_" and
# combined with each host assembly in `hosts` (combined STAR index, GTF, chrom sizes and
# excluderanges; used by ttseq-pe). Only GRCh38 for now.
drosophila:
  assembly: "BDGP6.54"
  release: "114"
  hosts: ["GRCh38"]
  urls:
    genome_fa: "https://ftp.ensembl.org/pub/release-114/fasta/drosophila_melanogaster/dna/Drosophila_melanogaster.BDGP6.54.dna.toplevel.fa.gz"
    annotation_gtf: "https://ftp.ensembl.org/pub/release-114/gtf/drosophila_melanogaster/Drosophila_melanogaster.BDGP6.54.114.gtf.gz"
  excluderanges:
    # Boyle-lab dm6-Excludable.v2 (UCSC chr names; renamed chr* -> dm6_* when combined)
    bed_url: "https://api.bedbase.org/v1/files/files/d/0/d0d8bd464aca2ed89769658d4981cc3d.bed.gz"

# Spike-in / decoy sequences used by several of the human indices (STAR,
# bowtie2, bwa, bwa-mem2, salmon, minimap2, minibwa include ERCC+GFP; Bismark and
# bwa-meth include the lambda phage genome instead.
spike_ins:
  ercc_url: "https://github.com/coriell-research/snakemake-pipelines/raw/refs/heads/main/generate-resources/data/ERCC92.fa.gz"
  gfp_url: "https://github.com/coriell-research/snakemake-pipelines/raw/refs/heads/main/generate-resources/data/pEGFP-N1.fa.gz"
  lambda_url: "https://github.com/coriell-research/snakemake-pipelines/raw/refs/heads/main/generate-resources/data/J02459.1_lambda.fa.gz"
  # E. coli K-12 MG1655 (NCBI RefSeq GCF_000005845.2); standalone bowtie2 index for CUT&RUN spike-in scaling
  ecoli_url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/005/845/GCF_000005845.2_ASM584v2/GCF_000005845.2_ASM584v2_genomic.fna.gz"

threads:
  star: 32
  bowtie2: 32
  salmon: 32
  bismark_genome_preparation: 24
  minibwa: 32

