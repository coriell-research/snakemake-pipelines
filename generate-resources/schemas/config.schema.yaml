$schema: "https://json-schema.org/draft/2020-12/schema"
description: Schema for generate-resources config.yaml
type: object
additionalProperties: false
required:
  - resources_dir
  - human
  - mouse
  - spike_ins
properties:
  resources_dir:
    type: string
    minLength: 1

  human:
    type: object
    additionalProperties: false
    required: [assembly, release, urls, star, excluderanges]
    properties:
      assembly:
        type: string
      release:
        type: string
      urls:
        type: object
        additionalProperties: false
        required: [annotation_gtf, promoter_windows, transcripts_fa, genome_fa]
        properties:
          annotation_gtf:
            type: string
          promoter_windows:
            type: string
          transcripts_fa:
            type: string
          genome_fa:
            type: string
      star:
        type: object
        additionalProperties: false
        required: [sjdb_overhang]
        properties:
          sjdb_overhang:
            type: integer
            minimum: 1
      excluderanges:
        type: object
        additionalProperties: false
        required: [annotationhub_id]
        properties:
          annotationhub_id:
            type: string

  mouse:
    type: object
    additionalProperties: false
    required: [m38, m25]
    properties:
      m38:
        type: object
        additionalProperties: false
        required: [assembly, release, urls]
        properties:
          assembly:
            type: string
          release:
            type: string
          urls:
            type: object
            additionalProperties: false
            required: [annotation_gtf, transcripts_fa, genome_fa]
            properties:
              annotation_gtf:
                type: string
              transcripts_fa:
                type: string
              genome_fa:
                type: string
      m25:
        type: object
        additionalProperties: false
        required: [assembly, release, urls]
        properties:
          assembly:
            type: string
          release:
            type: string
          urls:
            type: object
            additionalProperties: false
            required:
              - annotation_gtf
              - transcripts_fa
              - genome_fa
              - rseqc_basic_bed
              - rseqc_comprehensive_bed
              - rseqc_ucsc_knowngene_bed
              - rseqc_housekeeping_bed
            properties:
              annotation_gtf:
                type: string
              transcripts_fa:
                type: string
              genome_fa:
                type: string
              rseqc_basic_bed:
                type: string
              rseqc_comprehensive_bed:
                type: string
              rseqc_ucsc_knowngene_bed:
                type: string
              rseqc_housekeeping_bed:
                type: string

  spike_ins:
    type: object
    additionalProperties: false
    required: [ercc_fasta, gfp_fasta, lambda_fasta_gz]
    properties:
      ercc_fasta:
        type: string
        minLength: 1
      gfp_fasta:
        type: string
        minLength: 1
      lambda_fasta_gz:
        type: string
        minLength: 1

  threads:
    type: object
    additionalProperties: false
    properties:
      star:
        type: integer
        minimum: 1
      bowtie2:
        type: integer
        minimum: 1
      salmon:
        type: integer
        minimum: 1
      bismark_genome_preparation:
        type: integer
        minimum: 1
      minibwa:
        type: integer
        minimum: 1
