$schema: "https://json-schema.org/draft/2020-12/schema"
description: Schema for rnaseq-pe config.yaml
type: object
additionalProperties: false
required:
  - fastp
  - star
  - salmon
  - rustqc
  - mosdepth
properties:
  work_dir:
    type: string

  fastp:
    type: object
    additionalProperties: false
    required: [extra_params]
    properties:
      threads:
        type: integer
        minimum: 1
      extra_params:
        type: string

  star:
    type: object
    additionalProperties: false
    required: [index_dir, extra_params]
    properties:
      threads:
        type: integer
        minimum: 1
      index_dir:
        type: string
        minLength: 1
      extra_params:
        type: string

  salmon:
    type: object
    additionalProperties: false
    required: [index_dir, lib_type, gibbs, extra_params]
    properties:
      threads:
        type: integer
        minimum: 1
      index_dir:
        type: string
        minLength: 1
      lib_type:
        type: string
      gibbs:
        type: integer
        minimum: 0
      extra_params:
        type: string

  rustqc:
    type: object
    additionalProperties: false
    required: [gtf, biotype, stranded]
    properties:
      threads:
        type: integer
        minimum: 1
      gtf:
        type: string
        minLength: 1
      biotype:
        type: string
      stranded:
        type: string
        enum: ["forward", "reverse", "unstranded"]

  mosdepth:
    type: object
    additionalProperties: false
    required: [window_size, include_flag, extra_params]
    properties:
      threads:
        type: integer
        minimum: 1
      window_size:
        type: integer
        minimum: 1
      include_flag:
        type: integer
        minimum: 0
      extra_params:
        type: string
