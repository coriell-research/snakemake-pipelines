work_dir: "results"

fastp:
  threads: 6
  extra_params: "--detect_adapter_for_pe"

star:
  threads: 8
  index_dir: "/mnt/data/references/GRCh38/GENCODE/v48/STAR_idx"
  # quantMode, outSAMtype, readFilesCommand are fixed in the rule (outputs depend on them)
  extra_params: >-
    --twopassMode Basic
    --outFilterMultimapNmax 100
    --winAnchorMultimapNmax 100
    --alignSJoverhangMin 8
    --alignSJDBoverhangMin 1
    --outFilterMismatchNmax 999
    --outFilterMismatchNoverLmax 0.1
    --alignIntronMin 20
    --alignIntronMax 1000000
    --alignMatesGapMax 1000000
    --outFilterScoreMinOverLread 0.33
    --outFilterMatchNminOverLread 0.33
    --limitSjdbInsertNsj 1200000
    --outSAMstrandField intronMotif
    --outSAMattributes Standard

salmon:
  threads: 12
  index_dir: "/mnt/data/references/GRCh38/rmskProfiler/hg38-resources_v48/rmsk-salmon_index"
  lib_type: "A"
  gibbs: 100
  extra_params: "--gcBias --seqBias --posBias"

rustqc:
  threads: 6
  gtf: "/mnt/data/references/GRCh38/GENCODE/v48/gencode.v48.basic.annotation.gtf.gz"
  biotype: "gene_type"
  stranded: "reverse"

mosdepth:
  threads: 6
  window_size: 500
  extra_params: "--fast-mode"
  include_flag: 3

tetranscripts:
  # https://github.com/mhammell-laboratory/TEtranscripts - TEcount is run via singularity
  # (container only). The image is pulled once to `sif` (rule pull_tetranscripts) unless it
  # already exists there; point `sif` at a shared, pre-pulled image to skip the pull.
  image: "docker://mhammelllab/tetranscripts:latest"
  sif: "containers/tetranscripts.sif"
  # pre-built indexes (.ind) load much faster than building from .gtf; either is accepted
  gtf: "/mnt/data/references/GRCh38/TEtranscripts/gencode.v48.chr_patch_hapl_scaff.annotation.gtf.ind"
  te: "/mnt/data/references/GRCh38/TEtranscripts/GRCh38_GENCODE_rmsk_TE.gtf.ind"
  stranded: "reverse"   # no | forward | reverse (TruSeq stranded = reverse)
  mode: "multi"         # multi (EM over multi-mappers) | uniq (unique mappers only)
  extra_params: ""
