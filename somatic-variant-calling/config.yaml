fastp:
  extra_params: "--detect_adapter_for_pe"

ref:
  # All resources below (PoN, gnomAD, dbSNP, common SNPs) are aligned to this
  # exact fasta (GATK hg38 resource bundle, chr-prefixed contigs). These
  # "resources/..." paths are downloaded automatically by the
  # download_gatk_resource(s) rule(s) the first time they're needed - see
  # config.yaml -> Snakefile Resource download section.
  fasta: "resources/Homo_sapiens_assembly38.fasta"
  fai: "resources/Homo_sapiens_assembly38.fasta.fai"
  dict: "resources/Homo_sapiens_assembly38.dict"
  bwa_index_prefix: "resources/Homo_sapiens_assembly38.fasta"

gatk:
  # Downloaded automatically (see Resource download section in the Snakefile).
  pon: "resources/1000g_pon.hg38.vcf.gz"
  glr: "resources/af-only-gnomad.hg38.vcf.gz"
  snps: "resources/small_exac_common_3.hg38.vcf.gz"

mutect:
  strategy: "FALSE_DISCOVERY_RATE"
  fdr: 0.01
  alt_reads: 3
  read_pos: 10
  base_qual: 30
  min_allele: 0.05
  progress_seconds: 120

muse:
  # Downloaded automatically, already bgzipped+tabix-indexed.
  dbsnp: "resources/Homo_sapiens_assembly38.dbsnp138.vcf.gz"

strelka:
  # WES data - restricts calling to the padded exome model
  config_extra: "--exome"
  run_extra: ""

deepsomatic:
  # https://github.com/google/deepsomatic - run via singularity (no wrapper
  # exists; it's only published as a container).
  bin_version: "1.10.0"
  # "WES" or "WGS" - picks --model_type per patient (WES/FFPE_WES_TUMOR_ONLY
  # vs WGS/WGS_TUMOR_ONLY - see rule deepsomatic_call) and whether calling is
  # restricted to cnvkit.baits via --regions.
  assay_type: "WES"

consensus:
  # Minimum number of callers that must PASS a site for it to survive into
  # the consensus VCF (bcftools isec -n+<N>, i.e. "at least N"). Most runs of
  # this pipeline are WES tumor-normal pairs, where 4 callers run (Mutect2,
  # MuSE2, Strelka2, DeepSomatic) - defaults to requiring 3/4 rather than
  # unanimous 4/4, which was too strict in practice.
  min_callers_paired: 3
  # Tumor-only patients only run 2 callers (Mutect2, DeepSomatic); defaults
  # to requiring both (2/2).
  min_callers_tumor_only: 2

vep:
  # Existing local offline cache (single species/build: homo_sapiens/115_GRCh38)
  cache: "/usr/local/programs/ensembl-vep/cache"
  # No plugins configured by default; add plugin names here (and matching
  # aux-file inputs in the Snakefile) as needed.
  plugins: []
  extra: "--everything"

cnvkit:
  # Agilent Sure Select v6 All Exons padded BED file. Downloaded automatically
  # from this repo (see Resource download section in the Snakefile) - only
  # works once somatic-variant-calling/data/ is committed and pushed.
  baits: "resources/agilent-sure-select-v6-all-exons_S07604514_Padded.bed"
  method: "hybrid"

hotspots:
  # cancerhotspots.org (v2, GRCh38) recurrent mutation positions. Downloaded
  # automatically like cnvkit.baits above, but not yet consumed by any rule -
  # reserved for a future hotspot-annotation/filtering step.
  path: "resources/cancerhotspots_v2_GRCh38.tsv"

java:
  java_args: "-Xmx64G"
