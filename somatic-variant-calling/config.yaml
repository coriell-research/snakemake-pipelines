fastp:
  extra_params: "--detect_adapter_for_pe"

ref:
  # All resources below (PoN, gnomAD, dbSNP, common SNPs) are aligned to this
  # exact fasta (GATK hg38 resource bundle, chr-prefixed contigs). These
  # "resources/..." paths are downloaded automatically by the
  # download_gatk_resource(s) rule(s) the first time they're needed - see
  # config.yaml -> Snakefile Resource download section.
  fasta: "resources/Homo_sapiens_assembly38.fasta"
  fai: "resources/Homo_sapiens_assembly38.fasta.fai"
  dict: "resources/Homo_sapiens_assembly38.dict"
  bwa_index_prefix: "resources/Homo_sapiens_assembly38.fasta.64"

gatk:
  pon: "resources/1000g_pon.hg38.vcf.gz"
  glr: "resources/af-only-gnomad.hg38.vcf.gz"
  snps: "resources/small_exac_common_3.hg38.vcf.gz"

mutect:
  alt_reads: 3
  read_pos: 10
  base_qual: 30
  min_allele: 0.05
  progress_seconds: 120

muse:
  dbsnp: "resources/Homo_sapiens_assembly38.dbsnp138.vcf.gz"

strelka:
  config_extra: "--exome"
  run_extra: ""

mosdepth:
  extra: ""

deepsomatic:
  # https://github.com/google/deepsomatic - run via singularity (no wrapper
  # exists; it's only published as a container).
  bin_version: "1.10.0"
  # "WES" or "WGS" - picks --model_type per patient (WES/FFPE_WES_TUMOR_ONLY
  # vs WGS/WGS_TUMOR_ONLY - see rule deepsomatic_call) and whether calling is
  # restricted to cnvkit.baits via --regions.
  assay_type: "WES"

consensus:
  # Minimum number of callers that must PASS a site for it to survive into
  # the consensus VCF (bcftools isec -n+<N>, i.e. "at least N").
  min_callers_paired: 2
  # Tumor-only patients only run 2 callers (Mutect2, DeepSomatic); defaults
  # to requiring both (2/2).
  min_callers_tumor_only: 2

vep:
  # Cache is downloaded automatically via the bio/vep/cache wrapper (see rule
  # vep_cache) into resources/vep/cache - no local cache path needed.
  species: "homo_sapiens"
  build: "GRCh38"
  release: 115
  plugins: []
  extra: "--everything"

cnvkit:
  baits: "resources/agilent-sure-select-v6-all-exons_S07604514_Padded.bed.gz"
  method: "hybrid"

hotspots:
  path: "resources/cancerhotspots_v2_GRCh38.tsv"

somaticfreq:
  extra: ""

java:
  java_args: "-Xmx64G"
