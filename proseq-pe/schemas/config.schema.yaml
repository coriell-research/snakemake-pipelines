$schema: "https://json-schema.org/draft/2020-12/schema"
description: Schema for proseq-pe config.yaml
type: object
additionalProperties: false
$defs:
  contig:
    # used verbatim inside samtools filter expressions
    type: string
    pattern: "^[A-Za-z0-9_.:-]+$"
  threads:
    type: integer
    minimum: 1
  window:
    type: array
    minItems: 2
    maxItems: 2
    items:
      type: integer
required:
  - annotation_gtf
  - spike_prefix
  - spikein_exclude_contigs
  - rdna_contigs
  - host_contig_regex
  - mito_contig
  - fastp
  - bowtie2
  - filter
  - annotation
  - windows
  - bigwig
properties:
  work_dir:
    type: string

  annotation_gtf:
    type: string
    minLength: 1

  spike_prefix:
    type: string
    pattern: "^[A-Za-z0-9_]+$"

  spikein_exclude_contigs:
    type: array
    items:
      $ref: "#/$defs/contig"

  rdna_contigs:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/contig"

  host_contig_regex:
    # used inside samtools expressions and awk; no quotes or backslashes
    type: string
    pattern: "^[^'\"\\\\]+$"

  mito_contig:
    $ref: "#/$defs/contig"

  fastp:
    type: object
    additionalProperties: false
    required: [extra_params]
    properties:
      threads:
        $ref: "#/$defs/threads"
      extra_params:
        type: string

  umi:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
      r1_length:
        type: integer
        minimum: 1
      r2_length:
        type: integer
        minimum: 1

  bowtie2:
    type: object
    additionalProperties: false
    required: [index, extra_params]
    properties:
      threads:
        type: integer
        minimum: 2
      index:
        type: string
        minLength: 1
      extra_params:
        type: string
        # the wrapper sets threads and output; it exits if these are passed
        not:
          pattern: "(^|\\s)(-p|--threads|-o|-O|--output-fmt|--write-index|-@)(\\s|=|$)"

  samtools:
    type: object
    additionalProperties: false
    properties:
      threads:
        $ref: "#/$defs/threads"

  featurecounts:
    type: object
    additionalProperties: false
    properties:
      threads:
        $ref: "#/$defs/threads"

  filter:
    type: object
    additionalProperties: false
    required: [min_mapq, remove_duplicates]
    properties:
      min_mapq:
        type: integer
        minimum: 0
        maximum: 255
      remove_duplicates:
        type: boolean

  annotation:
    type: object
    additionalProperties: false
    required: [gene_types]
    properties:
      gene_types:
        type: array
        minItems: 1
        items:
          type: string

  windows:
    type: object
    additionalProperties: false
    required: [tss, pause, body_offset, body_min_span, active_min_reads]
    properties:
      tss:
        $ref: "#/$defs/window"
      pause:
        $ref: "#/$defs/window"
      body_offset:
        type: integer
        minimum: 0
      body_min_span:
        type: integer
        minimum: 1
      active_min_reads:
        type: integer
        minimum: 0

  spikein:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean

  bigwig:
    type: object
    additionalProperties: false
    required: [negate_minus]
    properties:
      threads:
        $ref: "#/$defs/threads"
      negate_minus:
        type: boolean

  preseq:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
