$schema: "https://json-schema.org/draft/2020-12/schema"
description: Schema for a single row of rrbs-pe samples.csv
type: object
additionalProperties: false
required:
  - sample_name
  - read1
  - read2
properties:
  sample_name:
    type: string
    pattern: "^[A-Za-z0-9_.-]+$"
  read1:
    type: string
    pattern: "\\.f(ast)?q\\.gz$"
  read2:
    type: string
    pattern: "\\.f(ast)?q\\.gz$"
